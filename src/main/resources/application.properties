spring.application.name=finance-tracker-backend

# Server
server.port=${PORT:8080}

# Database PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME:finance_tracker}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=13

# Configurações do Hikari para evitar erro de Pool no Supabase/Neon
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
