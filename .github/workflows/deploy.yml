name: Deploy to Termux
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Build with Maven
        run: mvn clean package -s settings.xml -DskipTests

      - name: Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Deploy to Smartphone
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          PHONE_IP: ${{ secrets.PHONE_TAILSCALE_IP }}
          JAR_PATH: target/finance-tracker-backend-1.0.0.jar
          DEST_DIR: ~/finance-tracker
        run: |
          if [ -z "$SSH_USER" ]; then echo "Erro: Secret SSH_USER esta vazio!"; exit 1; fi
          if [ -z "$PHONE_IP" ]; then echo "Erro: Secret PHONE_TAILSCALE_IP esta vazio!"; exit 1; fi
          ssh -v -o StrictHostKeyChecking=no -o PubkeyAcceptedKeyTypes=+ssh-rsa -p 8022 -i ~/.ssh/id_rsa $SSH_USER@$PHONE_IP "mkdir -p $DEST_DIR"
          scp -v -O -o StrictHostKeyChecking=no -o PubkeyAcceptedKeyTypes=+ssh-rsa -P 8022 -i ~/.ssh/id_rsa $JAR_PATH $SSH_USER@$PHONE_IP:$DEST_DIR/app.jar
          ssh -v -o StrictHostKeyChecking=no -o PubkeyAcceptedKeyTypes=+ssh-rsa -p 8022 -i ~/.ssh/id_rsa $SSH_USER@$PHONE_IP "killall java || true"
          ssh -v -o StrictHostKeyChecking=no -o PubkeyAcceptedKeyTypes=+ssh-rsa -p 8022 -i ~/.ssh/id_rsa $SSH_USER@$PHONE_IP "cd $DEST_DIR && nohup java -jar app.jar > backend.log 2>&1 < /dev/null & sleep 1; exit"

